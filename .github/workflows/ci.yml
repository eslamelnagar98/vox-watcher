name: CI

# Builds and tests on every pull request and on code changes to main.
# Kept separate from watch.yml so tests never slow down or block the 5-minute checks.

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "web/**"
      - "VoxWatcher.slnx"
      - "Directory.Build.props"
      - "global.json"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Test the watcher
        run: dotnet test -c Release

      - name: Test the web app's logic
        run: node --test tests/web/model.test.mjs
