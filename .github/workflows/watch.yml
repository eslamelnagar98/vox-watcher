name: VOX watcher

on:
  schedule:
    - cron: "*/5 * * * *"        # every 5 minutes (GitHub often starts it 10 to 20 minutes late)
  push:
    branches: [main]
    paths: ["watches.json", "src/**"]   # run right away when you change your watches
  workflow_dispatch:
    inputs:
      mode:
        description: "What to run"
        type: choice
        options: [watch, test-notify, catalog]
        default: watch

permissions:
  contents: write                # the bot saves state/ back to the repo

concurrency:
  group: vox-watcher
  cancel-in-progress: false

jobs:
  watch:
    # ubuntu-24.04, not ubuntu-latest: Google Chrome is preinstalled and Playwright supports it.
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
      # Probe result on GitHub runners: plain HTTP and Playwright's bundled Chromium are rejected by VOX's CDN,
      # the installed Google Chrome gets 200. So: real browser, Chrome channel.
      VOX_FETCHER: browser
      VOX_BROWSER_CHANNEL: chrome
    steps:
      - uses: actions/checkout@v4

      - name: Get state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The watcher's memory lives on the "state" branch, so main only changes when you change it.
          url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$url" state > /dev/null; then
            git clone --quiet --depth 1 --branch state "$url" state
          else
            echo "No state branch yet. Starting fresh."
            git init --quiet -b state state
            git -C state remote add origin "$url"
          fi

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build
        run: dotnet build src/VoxWatcher -c Release -nologo -v q

      - name: Check browser
        run: |
          # Chrome is preinstalled on ubuntu-24.04 runners. Install it only if an image ever lacks it.
          google-chrome --version || pwsh src/VoxWatcher/bin/Release/net10.0/playwright.ps1 install --with-deps chrome

      - name: Run (${{ inputs.mode || 'watch' }})
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          NTFY_SERVER: ${{ vars.NTFY_SERVER }}
        run: |
          MODE="${{ inputs.mode || 'watch' }}"
          if [ "$MODE" = "watch" ]; then
            # Check about 3 times per job (every 100 to 115 s), because the schedule itself is unreliable.
            dotnet run --project src/VoxWatcher -c Release --no-build -- watch --loop-seconds 240 --interval-seconds 100
          else
            dotnet run --project src/VoxWatcher -c Release --no-build -- "$MODE"
          fi

      - name: Save state
        if: always()
        run: |
          if [ ! -d state/.git ]; then echo "No state to save."; exit 0; fi
          cd state
          git config user.name "vox-bot"
          git config user.email "vox-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Nothing changed."; exit 0; fi
          git commit --quiet -m "state: $(TZ=Africa/Cairo date '+%a %d %b %H:%M')"
          git push --quiet origin HEAD:state || { git pull --quiet --rebase origin state && git push --quiet origin HEAD:state; }
