name: VOX watcher

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 minutes (GitHub may delay a few minutes)
  workflow_dispatch:         # lets you run it by hand from the Actions tab

permissions:
  contents: write            # needed to save state/ back to the repo

concurrency:
  group: vox-watcher
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Check VOX
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: dotnet run watch.cs

      - name: Save state
        run: |
          git config user.name "vox-bot"
          git config user.email "vox-bot@users.noreply.github.com"
          git add state
          git diff --cached --quiet || (git commit -m "VOX dates changed" && git push)
