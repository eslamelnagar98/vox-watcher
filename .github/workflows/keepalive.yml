name: keep-alive

# GitHub disables scheduled workflows in public repos after 60 days without repository activity.
# Instead of committing to main (which is protected), re-enable the scheduled workflows through the API
# once a week. This resets GitHub's inactivity timer and needs no write access to any branch.

on:
  schedule:
    - cron: "23 7 * * 1"         # Mondays 07:23 UTC
  workflow_dispatch:

permissions:
  actions: write                 # enable workflows; no contents access at all

concurrency:
  group: keep-alive
  cancel-in-progress: false

jobs:
  keepalive:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Keep scheduled workflows enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for wf in watch.yml keepalive.yml; do
            gh workflow enable "$wf" --repo "$GITHUB_REPOSITORY"
            echo "Enabled $wf"
          done
